# 打 tag 时自动构建并创建 GitHub Release，附带 Obsidian 商店要求的三个二进制文件
# （main.js / manifest.json / styles.css）。两种 tag：
# - 正式版 `X.Y.Z`：必须与 manifest.json 的 version 完全一致，不带 v 前缀（Obsidian 约定），不一致即失败；
# - beta `X.Y.Z-beta.N`（含 `-` 即视为预发布）：给 BRAT 真机实测用，只改产物里的 manifest 版本、
#   发成 pre-release，仓库里的版本号不动，商店用户看不到它（流程见 dev-cycle 技能「版本号与发版」）。
name: Release

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    # 产物溯源证明（artifact attestation）所需：商店审核建议为发布产物提供可验证的构建来源。
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - name: 安装依赖
              run: npm ci
            - name: 构建
              run: npm run build
            - name: 校验版本号 / 写入 beta 版本号
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  node -e '
                  const fs = require("fs");
                  const tag = process.env.TAG;
                  const m = JSON.parse(fs.readFileSync("manifest.json", "utf8").trimStart());
                  if (tag.includes("-")) {
                    m.version = tag;
                    fs.writeFileSync("manifest.json", JSON.stringify(m, null, "\t") + "\n");
                    console.log(`beta 预发布：产物 manifest.json 的 version 改为 ${tag}`);
                  } else if (m.version !== tag) {
                    console.error(`tag ${tag} 与 manifest.json 的 version ${m.version} 不一致`);
                    process.exit(1);
                  }'
            - name: 产物溯源证明
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            - name: 创建 Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # 说明文本优先取仓库内 doc/release-notes/<tag>.md（人写的双语说明，随代码入库可追溯）；
              # 没有该文件时回退到 --generate-notes 自动生成。
              #
              # 先删同名 Release 再建，使本工作流**可重复触发**：`gh release create` 在 Release 已
              # 存在时直接报错退出，于是「把 tag 移到新提交、强推重发」这条路原本走不通（2026-08-09
              # 首次需要它时才发现）。`--yes` 免交互；不加 `--cleanup-tag`，tag 本身保留不动；
              # Release 不存在时该命令返回非零，用 `|| true` 咽掉，首次发布照常。
              #
              # 含 `-` 的 tag 加 `--prerelease`：不会成为「Latest」，BRAT 按版本号仍能取到它。
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  notes="doc/release-notes/$tag.md"
                  pre=""
                  case "$tag" in *-*) pre="--prerelease" ;; esac
                  gh release delete "$tag" --yes || true
                  if [ -f "$notes" ]; then
                    gh release create "$tag" $pre \
                      --title "$tag" \
                      --notes-file "$notes" \
                      main.js manifest.json styles.css
                  else
                    gh release create "$tag" $pre \
                      --title "$tag" \
                      --generate-notes \
                      main.js manifest.json styles.css
                  fi
