# 打 tag 时自动构建并创建 GitHub Release，附带 Obsidian 商店要求的三个二进制文件
# （main.js / manifest.json / styles.css）。tag 名必须与 manifest.json 的 version 完全一致，
# 不带 v 前缀（Obsidian 约定）。
name: Release

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    # 产物溯源证明（artifact attestation）所需：商店审核建议为发布产物提供可验证的构建来源。
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - name: 安装依赖
              run: npm ci
            - name: 构建
              run: npm run build
            - name: 产物溯源证明
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            - name: 创建 Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # 说明文本优先取仓库内 doc/release-notes/<tag>.md（人写的双语说明，随代码入库可追溯）；
              # 没有该文件时回退到 --generate-notes 自动生成。
              #
              # 先删同名 Release 再建，使本工作流**可重复触发**：`gh release create` 在 Release 已
              # 存在时直接报错退出，于是「把 tag 移到新提交、强推重发」这条路原本走不通（2026-08-09
              # 首次需要它时才发现）。`--yes` 免交互；不加 `--cleanup-tag`，tag 本身保留不动；
              # Release 不存在时该命令返回非零，用 `|| true` 咽掉，首次发布照常。
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  notes="doc/release-notes/$tag.md"
                  gh release delete "$tag" --yes || true
                  if [ -f "$notes" ]; then
                    gh release create "$tag" \
                      --title "$tag" \
                      --notes-file "$notes" \
                      main.js manifest.json styles.css
                  else
                    gh release create "$tag" \
                      --title "$tag" \
                      --generate-notes \
                      main.js manifest.json styles.css
                  fi
